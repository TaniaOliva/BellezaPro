<div class="min-h-screen bg-surface flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-primary font-serif">BellezaPro</h1>
      <p class="text-secondary text-sm mt-1">Sistema de Gestion Integral</p>
    </div>
    <div class="bg-white rounded-xl border border-outline-variant p-8 shadow-sm">
      <h2 class="text-xl font-bold text-on-surface mb-6">Iniciar sesion</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-on-surface mb-1">Correo electronico</label>
          <input type="email" [(ngModel)]="email" placeholder="tu@correo.com"
            class="w-full border border-outline-variant rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
        </div>
        <div>
          <label class="block text-sm font-semibold text-on-surface mb-1">Contrasena</label>
          <div class="relative">
            <input [type]="mostrarPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="••••••••"
              class="w-full border border-outline-variant rounded-lg px-3 py-2 pr-10 text-sm focus:outline-none focus:border-primary">
            <button type="button" (click)="mostrarPassword = !mostrarPassword"
              class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-700">
              <span class="material-symbols-outlined text-lg">{{ mostrarPassword ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>
        <div *ngIf="error" class="bg-error-container text-on-error-container text-sm rounded-lg px-3 py-2">
          {{ error }}
        </div>
        <button (click)="login()" [disabled]="cargando"
          class="w-full bg-primary text-on-primary font-semibold py-2.5 rounded-lg hover:bg-primary-container transition-colors disabled:opacity-50">
          {{ cargando ? 'Ingresando...' : 'Ingresar' }}
        </button>
        <button (click)="router.navigate(['/recuperar-password'])"
          class="w-full text-sm text-primary font-semibold py-1 hover:underline">
          Olvide mi contrasena
        </button>
        <div class="border-t border-outline-variant pt-4">
          <button (click)="router.navigate(['/registro'])"
            class="w-full border border-primary text-primary font-semibold py-2.5 rounded-lg hover:bg-primary hover:text-on-primary transition-colors">
            Crear cuenta nueva
          </button>
        </div>

        <!-- TEMPORAL - SOLO DESARROLLO: quitar este botón antes de producción -->
        <div class="border-t border-dashed border-amber-300 pt-4">
          <button (click)="entrarComoAdminDev()" [disabled]="cargando" type="button"
            class="w-full border border-dashed border-amber-400 text-amber-700 bg-amber-50 font-semibold py-2.5 rounded-lg hover:bg-amber-100 transition-colors disabled:opacity-50 flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-lg">construction</span>
            Entrar como Admin (temporal)
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
