<aside class="hidden md:flex flex-col fixed left-0 top-0 h-full w-[240px] bg-surface border-r border-outline-variant z-40 pt-[64px]">
  <!-- User Section -->
  <div class="px-4 mb-4 flex items-center gap-3">
    <div class="w-12 h-12 rounded-full bg-surface-container-high border border-outline-variant overflow-hidden flex items-center justify-center">
      <span class="material-symbols-outlined text-2xl text-secondary">account_circle</span>
    </div>
    <div class="flex flex-col">
      <span class="font-label-md text-on-surface">Admin Name</span>
      <span class="text-[10px] px-2 py-0.5 bg-primary-fixed text-primary rounded-full font-label-sm">
        Administrador
      </span>
    </div>
  </div>

  <!-- Nav Links -->
  <nav class="flex-1 px-2 space-y-1">
    <a routerLink="/admin/inicio"
       routerLinkActive="bg-secondary-fixed text-primary border-l-[3px] border-primary opacity-90 rounded-r-lg"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md text-secondary hover:bg-surface-container-high hover:text-primary">
      <span class="material-symbols-outlined">dashboard</span>
      <span class="flex-1">Inicio</span>
    </a>
    <a routerLink="/admin/agenda-general"
       routerLinkActive="bg-secondary-fixed text-primary border-l-[3px] border-primary opacity-90 rounded-r-lg"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md text-secondary hover:bg-surface-container-high hover:text-primary">
      <span class="material-symbols-outlined">calendar_month</span>
      <span class="flex-1">Agenda General</span>
    </a>
    <a routerLink="/admin/empleados"
       routerLinkActive="bg-secondary-fixed text-primary border-l-[3px] border-primary opacity-90 rounded-r-lg"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md text-secondary hover:bg-surface-container-high hover:text-primary">
      <span class="material-symbols-outlined">badge</span>
      <span class="flex-1">Empleados</span>
    </a>
    <a routerLink="/admin/servicios"
       routerLinkActive="bg-secondary-fixed text-primary border-l-[3px] border-primary opacity-90 rounded-r-lg"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md text-secondary hover:bg-surface-container-high hover:text-primary">
      <span class="material-symbols-outlined">content_cut</span>
      <span class="flex-1">Servicios</span>
    </a>
    <a routerLink="/admin/clientes"
       routerLinkActive="bg-secondary-fixed text-primary border-l-[3px] border-primary opacity-90 rounded-r-lg"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md text-secondary hover:bg-surface-container-high hover:text-primary">
      <span class="material-symbols-outlined">group</span>
      <span class="flex-1">Clientes</span>
    </a>
    <a routerLink="/admin/solicitudes-especiales"
       routerLinkActive="bg-secondary-fixed text-primary border-l-[3px] border-primary opacity-90 rounded-r-lg"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md text-secondary hover:bg-surface-container-high hover:text-primary">
      <span class="material-symbols-outlined">star</span>
      <span class="flex-1">Solicitudes Especiales</span>
    </a>
    <a routerLink="/admin/reportes-clientes"
       routerLinkActive="bg-secondary-fixed text-primary border-l-[3px] border-primary opacity-90 rounded-r-lg"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md text-secondary hover:bg-surface-container-high hover:text-primary">
      <span class="material-symbols-outlined">report_problem</span>
      <span class="flex-1">Reportes de Clientes</span>
    </a>
    <a routerLink="/admin/reportes-estadisticas"
       routerLinkActive="bg-secondary-fixed text-primary border-l-[3px] border-primary opacity-90 rounded-r-lg"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md text-secondary hover:bg-surface-container-high hover:text-primary">
      <span class="material-symbols-outlined">analytics</span>
      <span class="flex-1">Reportes y Estadisticas</span>
    </a>
    <a routerLink="/admin/configuracion"
       routerLinkActive="bg-secondary-fixed text-primary border-l-[3px] border-primary opacity-90 rounded-r-lg"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md text-secondary hover:bg-surface-container-high hover:text-primary">
      <span class="material-symbols-outlined">settings</span>
      <span class="flex-1">Configuracion</span>
    </a>
  </nav>

  <!-- Logout -->
  <div class="px-4 pb-4">
    <button (click)="logout()" class="w-full flex items-center gap-2 px-4 py-3 text-error font-label-md hover:bg-error-container rounded-lg transition-colors">
      <span class="material-symbols-outlined text-sm">logout</span>
      Cerrar sesión
    </button>
  </div>
</aside>
