<nav class="fixed top-0 left-0 right-0 z-50 bg-surface border-b border-outline-variant shadow-sm h-[64px] flex justify-between items-center px-[32px]">
  <div class="flex items-center gap-2">
    <span class="material-symbols-outlined text-primary text-2xl">content_cut</span>
    <div class="flex flex-col">
      <span class="text-[20px] font-bold text-primary leading-none">BellezaPro</span>
    </div>
  </div>

  <div class="hidden md:flex gap-[24px]" *ngIf="showAcceder || navLinks.length > 0">
    <a *ngFor="let link of navLinks"
       [href]="link.href"
       [class.border-b-2]="link.active"
       [class.border-primary]="link.active"
       [class.text-primary]="link.active"
       [class.text-secondary]="!link.active"
       class="font-label-md transition-colors hover:text-primary pb-1">
      {{ link.label }}
    </a>
  </div>

  <div class="flex items-center gap-3">
    <button *ngIf="showAcceder; else userArea"
            class="bg-primary text-on-primary rounded-lg px-4 py-2 font-label-md flex items-center gap-2 hover:bg-surface-tint transition-colors">
      <span class="material-symbols-outlined text-sm">security</span>
      Acceder
    </button>

    <ng-template #userArea>
      <div *ngIf="showUserAvatar" class="notif-wrapper relative">
        <button (click)="toggleDropdown()"
          class="relative p-2 rounded-full hover:bg-surface-container-high transition-colors">
          <span class="material-symbols-outlined text-secondary hover:text-primary">notifications</span>
          <span *ngIf="noLeidas > 0"
            class="absolute top-1 right-1 w-4 h-4 bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center leading-none">
            {{ noLeidas > 9 ? '9+' : noLeidas }}
          </span>
        </button>

        <div *ngIf="mostrarDropdown"
          class="absolute right-0 top-12 w-80 bg-white border border-gray-200 rounded-xl shadow-xl z-[200] overflow-hidden">

          <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
            <p class="font-bold text-gray-800 text-sm">Notificaciones</p>
            <button *ngIf="noLeidas > 0" (click)="marcarTodas()"
              class="text-xs text-red-600 hover:text-red-700 font-semibold">
              Marcar todas
            </button>
          </div>

          <div class="max-h-[360px] overflow-y-auto divide-y divide-gray-50">
            <div *ngIf="notificacionesMostradas.length === 0"
              class="px-4 py-8 text-center text-sm text-gray-400 italic">
              Sin notificaciones nuevas.
            </div>

            <div *ngFor="let n of notificacionesMostradas"
              (click)="clickNotificacion(n)"
              [class.bg-red-50]="!n.leida"
              class="flex gap-3 px-4 py-3 cursor-pointer hover:bg-gray-50 transition">
              <div [class.bg-red-100]="!n.leida" [class.bg-gray-100]="n.leida"
                class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 mt-0.5">
                <span class="material-symbols-outlined text-sm"
                  [class.text-red-600]="!n.leida" [class.text-gray-400]="n.leida">
                  {{ iconoPorTipo(n.tipo) }}
                </span>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-gray-800 leading-snug">{{ n.titulo }}</p>
                <p *ngIf="n.descripcion" class="text-xs text-gray-500 leading-snug mt-0.5 line-clamp-2">{{ n.descripcion }}</p>
                <p class="text-xs text-gray-400 mt-1">{{ tiempoRelativo(n.creadoEn) }}</p>
              </div>
              <div *ngIf="!n.leida" class="w-2 h-2 bg-red-500 rounded-full mt-1.5 shrink-0"></div>
            </div>
          </div>

        </div>
      </div>
    </ng-template>
  </div>
</nav>
