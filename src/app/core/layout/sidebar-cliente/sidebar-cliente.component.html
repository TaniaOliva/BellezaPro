<aside class="hidden md:flex flex-col fixed left-0 top-0 h-full w-[240px] bg-surface border-r border-outline-variant z-40 pt-[64px]">
  <!-- User Section -->
  <div class="px-4 mb-4 flex items-center gap-3">
    <div class="w-12 h-12 rounded-full bg-surface-container-high border border-outline-variant overflow-hidden flex items-center justify-center">
      <span class="material-symbols-outlined text-2xl text-secondary">account_circle</span>
    </div>
    <div class="flex flex-col">
      <span class="font-label-md text-on-surface">Cliente Name</span>
      <span class="font-label-sm text-secondary">Cliente</span>
    </div>
  </div>

  <!-- Nav Links -->
  <nav class="flex-1 px-2 space-y-1">
    <a href="#/cliente/inicio"
       [class.bg-secondary-fixed]="activeRoute === 'inicio'"
       [class.text-primary]="activeRoute === 'inicio'"
       [class.border-l-[3px]]="activeRoute === 'inicio'"
       [class.border-primary]="activeRoute === 'inicio'"
       [class.text-secondary]="activeRoute !== 'inicio'"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md"
       [class.rounded-r-lg]="activeRoute === 'inicio'"
       [class.opacity-90]="activeRoute === 'inicio'"
       [class.hover:bg-surface-container-high]="activeRoute !== 'inicio'"
       [class.hover:text-primary]="activeRoute !== 'inicio'">
      <span class="material-symbols-outlined">home</span>
      <span class="flex-1">Inicio</span>
    </a>
    <a href="#/cliente/mis-citas"
       [class.bg-secondary-fixed]="activeRoute === 'mis-citas'"
       [class.text-primary]="activeRoute === 'mis-citas'"
       [class.border-l-[3px]]="activeRoute === 'mis-citas'"
       [class.border-primary]="activeRoute === 'mis-citas'"
       [class.text-secondary]="activeRoute !== 'mis-citas'"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md"
       [class.rounded-r-lg]="activeRoute === 'mis-citas'"
       [class.opacity-90]="activeRoute === 'mis-citas'"
       [class.hover:bg-surface-container-high]="activeRoute !== 'mis-citas'"
       [class.hover:text-primary]="activeRoute !== 'mis-citas'">
      <span class="material-symbols-outlined">calendar_today</span>
      <span class="flex-1">Mis Citas</span>
    </a>
    <a href="#/cliente/servicios"
       [class.bg-secondary-fixed]="activeRoute === 'servicios'"
       [class.text-primary]="activeRoute === 'servicios'"
       [class.border-l-[3px]]="activeRoute === 'servicios'"
       [class.border-primary]="activeRoute === 'servicios'"
       [class.text-secondary]="activeRoute !== 'servicios'"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md"
       [class.rounded-r-lg]="activeRoute === 'servicios'"
       [class.opacity-90]="activeRoute === 'servicios'"
       [class.hover:bg-surface-container-high]="activeRoute !== 'servicios'"
       [class.hover:text-primary]="activeRoute !== 'servicios'">
      <span class="material-symbols-outlined">content_cut</span>
      <span class="flex-1">Servicios</span>
    </a>
    <a href="#/cliente/solicitud-especial"
       [class.bg-secondary-fixed]="activeRoute === 'solicitud-especial'"
       [class.text-primary]="activeRoute === 'solicitud-especial'"
       [class.border-l-[3px]]="activeRoute === 'solicitud-especial'"
       [class.border-primary]="activeRoute === 'solicitud-especial'"
       [class.text-secondary]="activeRoute !== 'solicitud-especial'"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md"

       [class.opacity-90]="activeRoute === 'solicitud-especial'"

      <span class="material-symbols-outlined">auto_awesome</span>
      <span class="flex-1">Solicitud Especial</span>
    </a>
    <a href="#/cliente/perfil"
       [class.bg-secondary-fixed]="activeRoute === 'perfil'"
       [class.text-primary]="activeRoute === 'perfil'"
       [class.border-l-[3px]]="activeRoute === 'perfil'"
       [class.border-primary]="activeRoute === 'perfil'"
       [class.text-secondary]="activeRoute !== 'perfil'"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md"
       [class.rounded-r-lg]="activeRoute === 'perfil'"
       [class.opacity-90]="activeRoute === 'perfil'"
       [class.hover:bg-surface-container-high]="activeRoute !== 'perfil'"
       [class.hover:text-primary]="activeRoute !== 'perfil'">
      <span class="material-symbols-outlined">person</span>
      <span class="flex-1">Mi Perfil</span>
    </a>
    <a href="#/cliente/notificaciones"
       [class.bg-secondary-fixed]="activeRoute === 'notificaciones'"
       [class.text-primary]="activeRoute === 'notificaciones'"
       [class.border-l-[3px]]="activeRoute === 'notificaciones'"
       [class.border-primary]="activeRoute === 'notificaciones'"
       [class.text-secondary]="activeRoute !== 'notificaciones'"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md"
       [class.rounded-r-lg]="activeRoute === 'notificaciones'"
       [class.opacity-90]="activeRoute === 'notificaciones'"
       [class.hover:bg-surface-container-high]="activeRoute !== 'notificaciones'"

      <span class="material-symbols-outlined">notifications</span>
      <span class="flex-1">Notificaciones</span>
      <span class="bg-error text-on-error rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-bold">2</span>
    </a>
  </nav>

  <!-- Bottom CTA -->
  <div class="px-4 pb-4 mt-auto">
    <button class="w-full bg-primary text-on-primary font-label-md py-3 rounded-lg hover:bg-surface-tint transition-colors">
      Agendar cita
    </button>
  </div>
</aside>
